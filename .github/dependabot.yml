version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    # PocketBase checks at start that these match the versions it was tested
    # with and warns otherwise. They move only together with PocketBase.
    ignore:
      - dependency-name: modernc.org/sqlite
      - dependency-name: modernc.org/libc
      - dependency-name: modernc.org/memory
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    # codeql-action/init and /analyze must run the same version ("Loaded a
    # configuration file for version X, but running version Y"), so they are
    # bumped in one PR. Separate PRs both fail CI (#109, #110).
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
