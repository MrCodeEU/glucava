name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # caches modules and the build cache, keyed on go.sum
      - run: go vet ./...
      - run: go test -race ./...
        env:
          CHROME_PATH: /usr/bin/google-chrome
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
  # Single required status check for the branch ruleset.
  check:
    if: always()
    needs: [test, lint, vuln]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.test.result }}" = success ] && [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.vuln.result }}" = success ]
