name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod # caches modules and the build cache, keyed on go.sum
      # Typst typesets the PDF report; without it the report tests skip. Keep the
      # version and hash in step with the Dockerfile.
      - name: Install typst
        env:
          TYPST_VERSION: "0.15.1"
          TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
        run: |
          curl -fsSL -o typst.tar.xz "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  typst.tar.xz" | sha256sum -c -
          tar -xJf typst.tar.xz --strip-components=1 -C "$RUNNER_TEMP" typst-x86_64-unknown-linux-musl/typst
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: go vet ./...
      - run: go test -race ./...
        env:
          CHROME_PATH: /usr/bin/google-chrome
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
      # The committed app.css must match a fresh Tailwind build of input.css + the Go class strings.
      - run: make css-check
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-file: go.mod
          go-package: ./...
  # Single required status check for the branch ruleset.
  check:
    if: always()
    needs: [test, lint, vuln]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.test.result }}" = success ] && [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.vuln.result }}" = success ]
