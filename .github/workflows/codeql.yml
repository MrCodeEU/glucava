name: CodeQL
# Code scanning needs GitHub Advanced Security on private repos.
# Re-enable the pull_request, push and schedule triggers once the repo is public.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go
      - uses: github/codeql-action/analyze@v3
