name: CodeQL
# Uploading results needs GitHub Advanced Security on private repos (the scan
# itself runs, the upload fails). Once the repo is public, switch on:
#   pull_request:
#   push:
#     branches: [main]
#   schedule:
#     - cron: "17 4 * * 1"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: go
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
