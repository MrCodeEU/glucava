name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste secrets or health data**: no cookies, tokens, passwords, `.env` contents, glucose exports or screenshots of your real data. Redact logs first. Security problems go to the private report, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can reproduce it in demo mode (`make mock`), say so.
  - type: input
    id: version
    attributes:
      label: glucava version
      description: Shown in the page footer, or in the `build` field of `/health`.
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [Docker image, Binary, go run / make]
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (redacted)
      render: text
