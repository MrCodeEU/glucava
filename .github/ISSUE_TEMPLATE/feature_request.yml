name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: markdown
    attributes:
      value: |
        Glucava deliberately does not replace your CGM app: no alarms, dosing advice or medical interpretation. Ideas in that direction will be declined.
